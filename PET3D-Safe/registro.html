<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet3D Safe - Registro</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <style>
        body { background-color: #eef2f7; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; border-radius: 25px; padding: 25px; width: 85%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .logo { width: 150px; margin-bottom: 15px; }
        h2 { color: #2d3436; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-family: inherit; }
        .btn-save { background: #25d366; color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 16px; }
        .btn-save:disabled { background: #ccc; }
        .pass-info { font-size: 11px; color: #666; margin-bottom: 5px; text-align: left; padding-left: 5px; }
        .foto-label { display: block; text-align: left; font-size: 12px; color: #2d3436; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://ricaldeart.github.io/Pet3D/PET3D-Safe/logo-web.png" class="logo">
        <h2>Activar Medalla 🐾</h2>
        <form id="petForm">
            <input type="text" id="nombre" placeholder="Nombre de tu mascota" required>
            <input type="tel" id="whatsapp" placeholder="Tu WhatsApp (ej: 51992849437)" required>
            <textarea id="estado" placeholder="Notas importantes (ej: Alergias, carácter o dirección)"></textarea>
            
            <label class="foto-label">📸 Sube la foto de tu mascota:</label>
            <input type="file" id="fotoFile" accept="image/*">
            
            <input type="text" id="hogar" placeholder="Distrito o Ciudad">
            
            <div class="pass-info">🔒 Crea una clave para editar tus datos luego:</div>
            <input type="password" id="password" placeholder="Tu clave de seguridad" required>
            
            <button type="submit" id="btnEnviar" class="btn-save">GUARDAR Y ACTIVAR</button>
        </form>
    </div>

    <script>
        // Configuración con tu nuevo Storage Bucket del Plan Blaze
        const firebaseConfig = { 
            databaseURL: "https://pet3d-safe-default-rtdb.firebaseio.com/",
            storageBucket: "pet3d-safe.firebasestorage.app" 
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage();

        const urlParams = new URLSearchParams(window.location.search);
        const petId = urlParams.get('id');

        document.getElementById('petForm').onsubmit = async function(e) {
            e.preventDefault();
            if (!petId) { alert("Error: Escanea la medalla nuevamente."); return; }

            const btn = document.getElementById('btnEnviar');
            const file = document.getElementById('fotoFile').files[0];
            
            btn.innerText = "Subiendo datos...";
            btn.disabled = true;

            // Imagen por defecto si no suben nada
            let finalUrl = "https://ricaldeart.github.io/Pet3D/PET3D-Safe/logo-web.png";

            try {
                // 1. Si hay archivo, lo subimos a Firebase Storage
                if (file) {
                    const storageRef = storage.ref('fotos/' + petId);
                    await storageRef.put(file);
                    finalUrl = await storageRef.getDownloadURL();
                }

                // 2. Guardamos toda la información en Realtime Database
                const data = {
                    nombre: document.getElementById('nombre').value,
                    whatsapp: document.getElementById('whatsapp').value,
                    estado: document.getElementById('estado').value,
                    fotoUrl: finalUrl,
                    hogar: document.getElementById('hogar').value,
                    password: document.getElementById('password').value
                };

                await db.ref('mascotas/' + petId).set(data);
                
                alert("¡Excelente! Medalla activada."); 
                window.location.href = "ver.html?id=" + petId; 

            } catch (error) {
                console.error(error);
                alert("Hubo un error: " + error.message);
                btn.innerText = "GUARDAR Y ACTIVAR";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
