<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet3D Safe - Eva</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 40px 0;
        }
        .container {
            background-color: #ffffff;
            width: 90%;
            max-width: 400px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            padding-bottom: 30px;
            overflow: hidden;
        }
        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid #ff4d4d;
            margin: 30px auto 10px;
            object-fit: cover;
            display: block;
        }
        h1 {
            color: #ff4d4d;
            font-size: 28px;
            margin: 15px 0 10px;
        }
        .info-box {
            background-color: #fff5f5;
            border-left: 5px solid #ff4d4d;
            margin: 15px 20px 25px;
            padding: 15px;
            text-align: left;
            border-radius: 8px;
        }
        .info-item {
            margin: 5px 0;
            color: #444;
            font-size: 14px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 12px 20px;
            padding: 14px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            color: #ffffff;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }
        .btn-whatsapp { background-color: #25d366; }
        .btn-location { background-color: #4285f4; }
        
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #aaaaaa;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="Eva.jpeg" alt="Eva" class="profile-img">

    <h1>Hi! I'm Eva</h1>

    <div class="info-box">
        <div class="info-item">📍 <strong>Home:</strong> Berlin</div>
        <div class="info-item">⚠️ <strong>Note:</strong> I am very fearful :( .</div>
    </div>

    <a href="https://wa.me/51940036564?text=Hola,%20encontré%20a%20Eva" class="btn btn-whatsapp">
        📞 NOTIFY VIA WHATSAPP
    </a>

    <button onclick="compartirUbicacion()" class="btn btn-location" style="width: calc(100% - 40px);">
        📍 SHARE MY LOCATION
    </button>

    <div class="footer">
        Protected by Pet 3D Safe 🐾
    </div>
</div>

<script>
    function compartirUbicacion() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const urlMapas = "https://www.google.com/maps?q=" + lat + "," + lon;
                const mensaje = encodeURIComponent("Hola, encontré a Eva. Mi ubicación es: " + urlMapas);
                window.location.href = "https://wa.me/51940036564?text=" + mensaje;
            }, function(error) {
                alert("Por favor activa el GPS para compartir la ubicación.");
            });
        } else {
            alert("Tu navegador no permite compartir la ubicación.");
        }
    }
</script>

</body>
</html>
