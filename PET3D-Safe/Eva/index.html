<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>EVA Pet3D</title>
    <style>
        body {
            background-color: #fce4ec; /* Fondo rosa suave para que no se vea blanco */
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .tarjeta {
            background: white;
            width: 320px;
            padding: 20px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border: 4px solid #ff4d94; /* Borde rosa fuerte */
        }
        .contenedor-foto {
            width: 120px;
            height: 120px;
            background-color: #ffc1e3; /* Fondo de respaldo si no carga la foto */
            border-radius: 50%;
            margin: 0 auto 15px;
            overflow: hidden;
            border: 3px solid #ff4d94;
        }
        .contenedor-foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 { color: #333; margin: 10px 0; font-size: 24px; }
        p { color: #666; font-size: 14px; line-height: 1.4; }
        .numero {
            display: block;
            background: #2daae1;
            color: white;
            padding: 10px;
            margin-top: 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="tarjeta">
        <div class="contenedor-foto">
            <img src="Eva.jpg" alt="EVA">
        </div>
        
        <h1>EVA</h1>
        <p>Asistente Virtual de <strong>Pet3D</strong><br>Estilo Minnie v2.2</p>
        
        <p>¿Necesitas ayuda con tu diseño?</p>
        
        <a href="tel:+51940036564" class="numero">
            📞 51 940 036 564
        </a>
    </div>

</body>
</html>
