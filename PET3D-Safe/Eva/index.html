<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet3D Safe - Eva</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            padding-top: 50px;
            margin: 0;
        }
        .container {
            background-color: white;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            padding-bottom: 30px;
        }
        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid #ff4d4d;
            margin-top: 30px;
            object-fit: cover;
        }
        h1 {
            color: #ff4d4d;
            font-size: 28px;
            margin: 20px 0 10px;
        }
        .lost-text {
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        .info-box {
            background-color: #fff5f5;
            border-left: 5px solid #ff4d4d;
            margin: 0 20px 25px;
            padding: 15px;
            text-align: left;
            border-radius: 5px;
        }
        .info-item {
            margin: 5px 0;
            color: #555;
            font-size: 14px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 20px;
            padding: 12px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            color: white;
            font-size: 16px;
        }
        .btn-whatsapp { background-color: #25d366; }
        .btn-location { background-color: #4285f4; }
        
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="Eva.jpeg" alt="Hi! I'm Eva" class="profile-img">

    <h1>Hi! I'm Eva</h1>
    <p class="lost-text"><strong>I'M LOST.</strong> My family is looking for me, help me to get back home.</p>

    <div class="info-box">
        <div class="info-item">📍 <strong>Home:</strong> Berlin</div>
        <div class="info-item">⚠️ <strong>Note:</strong> I am very fearful :( .</div>
    </div>

    <a href="https://wa.me/51940036564?text=Hola,%20encontré%20a%20Eva" class="btn btn-whatsapp">
        📞 NOTIFY VIA WHATSAPP
    </a>

    <a href="#" class="btn btn-location">
        📍 SHARE MY LOCATION
    </a>

    <div class="footer">
        Protected by Pet 3D Safe 🐾
    </div>
</div>

</body>
</html>
