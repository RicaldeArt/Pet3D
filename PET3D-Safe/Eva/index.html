<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet3D Safe - Eva</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px 0;
        }

        /* Contenedor del Logo Superior */
        .logo-container {
            margin-bottom: 15px;
            text-align: center;
        }
        .logo-img {
            width: 140px; 
            height: auto;
            display: block;
        }

        .container {
            background-color: #ffffff;
            width: 90%;
            max-width: 400px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            padding-bottom: 30px;
            overflow: hidden;
        }

        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid #ffcc00; /* Borde amarillo de Eva */
            margin: 25px auto 10px;
            object-fit: cover;
            display: block;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin: 10px 0;
        }

        /* Cuadro de información estilo Minnie */
        .info-card {
            background-color: #f8faff;
            border: 1px solid #e1e8ed;
            border-radius: 15px;
            margin: 15px 25px 25px;
            padding: 15px;
            text-align: left;
        }

        .info-line {
            margin: 8px 0;
            color: #444;
            font-size: 15px;
            display: flex;
            align-items: center;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 12px 25px;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            color: #ffffff;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-whatsapp { background-color: #2ecf5d; }
        .btn-location { background-color: #4c77ea; }
        .btn:active { transform: scale(0.98); }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #888;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="../logo-web.png" alt="Pet3D Logo" class="logo-img">
    </div>

    <div class="container">
        <img src="Eva.jpeg" alt="Eva" class="profile-img">

        <h1>Hi! I'm Eva</h1>

        <div class="info-card">
            <div class="info-line">📍 <strong>Home:</strong> Berlin</div>
            <div class="info-line">⚠️ <strong>Hm5in</strong></div>
            <div class="info-line">🗒️ <strong>Note:</strong> I am very fearful :( .</div>
        </div>

        <a href="https://wa.me/51940036564?text=Hola,%20encontré%20a%20Eva" class="btn btn-whatsapp">
            Notify via WhatsApp
        </a>

        <button onclick="compartirUbicacion()" class="btn btn-location" style="width: calc(100% - 50px);">
            📍 Share my Ubicación
        </button>

        <div class="footer">
            🛡️ PROTEGIDO Pet 3D Safe 🐾
        </div>
    </div>

<script>
    function compartirUbicacion() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const urlMapas = "https://www.google.com/maps?q=" + lat + "," + lon;
                const mensaje = encodeURIComponent("Hola, encontré a Eva. Mi ubicación actual es: " + urlMapas);
                window.location.href = "https://wa.me/51940036564?text=" + mensaje;
            }, function() {
                alert("Por favor, activa el GPS para enviar la ubicación.");
            });
        } else {
            alert("Tu navegador no soporta geolocalización.");
        }
    }
</script>

</body>
</html>
