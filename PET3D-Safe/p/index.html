<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet3D Safe - Menú Principal</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #ff6600; --secondary: #2d3436; --bg-mint: #e8f5f1; }
        body { 
            background-color: var(--bg-mint); background-image: url("https://ricaldeart.github.io/Pet3D/PET3D-Safe/fondo-tile.png"); 
            background-size: 150px; font-family: 'Montserrat', sans-serif; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px;
        }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(232, 245, 241, 0.85); z-index: -1; }
        .card { background: white; border-radius: 35px; padding: 30px; width: 100%; max-width: 350px; box-shadow: 0 20px 40px rgba(0,0,0,0.12); text-align: center; }
        .logo { width: 180px; margin-bottom: 20px; }
        h1 { font-size: 18px; color: var(--secondary); margin-bottom: 25px; font-weight: 800; }
        .menu-btn {
            display: flex; align-items: center; width: 100%; padding: 18px; margin-bottom: 15px;
            border: none; border-radius: 20px; cursor: pointer; text-decoration: none; transition: 0.3s; box-sizing: border-box;
        }
        .menu-btn i { font-size: 24px; margin-right: 15px; width: 30px; }
        .menu-btn div { text-align: left; }
        .menu-btn b { display: block; font-size: 16px; }
        .menu-btn span { font-size: 12px; opacity: 0.8; }
        .btn-alert { background-color: #d32f2f; color: white; }
        .btn-guide { background-color: var(--secondary); color: white; }
        .btn-support { background-color: #25d366; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://ricaldeart.github.io/Pet3D/PET3D-Safe/logo-web.png" class="logo">
        <h1>Centro de Control SAFE</h1>
        <a href="control.html" class="menu-btn btn-alert">
            <i class="fas fa-bullhorn"></i>
            <div><b>REPORTE DE PÉRDIDA</b><span>Activar Red de Apoyo</span></div>

        <a href="tutoriales.html" class="menu-btn btn-guide">

            <div><b>TUTORIALES</b><span>Aprende a usar tu medalla</span></div>
        </a>
        <a href="https://wa.me/51992849437" class="menu-btn btn-support">
            <i class="fab fa-whatsapp"></i>
            <div><b>SOPORTE</b><span>Chat directo con Pet3D</span></div>
        </a>
    </div>
</body>
</html>
