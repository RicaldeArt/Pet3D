<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Pet3D SAFE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-orange: #ff6600;
            --bg-mint: #e8f5f1;
            --text-dark: #2d3436;
        }

        body {
            background-color: var(--bg-mint);
            background-image: url("https://ricaldeart.github.io/Pet3D/PET3D-Safe/fondo-tile.png");
            background-size: 150px;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Capa para aclarar el fondo */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(232, 245, 241, 0.85);
            z-index: -1;
        }

        .menu-container {
            background: white;
            border-radius: 40px;
            padding: 40px 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo {
            width: 180px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 20px;
            color: var(--text-dark);
            margin-bottom: 30px;
            font-weight: 800;
        }

        .menu-grid {
            display: grid;
            gap: 20px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            text-decoration: none;
            padding: 20px;
            border-radius: 25px;
            transition: transform 0.2s, box-shadow 0.2s;
            color: white;
            text-align: left;
        }

        .menu-item:active {
            transform: scale(0.96);
        }

        /* Estilos de botones */
        .btn-emergency {
            background: #d32f2f;
            box-shadow: 0 10px 20px rgba(211, 47, 47, 0.3);
        }

        .btn-tutorial {
            background: #2d3436;
            box-shadow: 0 10px 20px rgba(45, 52, 54, 0.3);
        }

        .btn-support {
            background: #25d366;
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3);
        }

        .menu-item i {
            font-size: 30px;
            margin-right: 20px;
            width: 40px;
            text-align: center;
        }

        .menu-text span {
            display: block;
            font-weight: 800;
            font-size: 16px;
            text-transform: uppercase;
        }

        .menu-text small {
            font-size: 12px;
            opacity: 0.9;
            font-weight: 400;
        }

        .footer-text {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <img src="https://ricaldeart.github.io/Pet3D/PET3D-Safe/logo-web.png" alt="Pet3D Safe" class="logo">
        
        <h1>¿Cómo podemos ayudarte?</h1>

        <div class="menu-grid">
            <a href="control.html" class="menu-item btn-emergency">
                <i class="fas fa-exclamation-triangle"></i>
                <div class="menu-text">
                    <span>Reportar Pérdida</span>
                    <small>Activar alerta de búsqueda</small>
                </div>
            </a>

            <a href="https://www.youtube.com/playlist?list=PLN7JvJKjM4JmNAQk80-LzFUAjt0VDPx7U" target="_blank" class="menu-item btn-tutorial">
                <i class="fab fa-youtube"></i>
                <div class="menu-text">
                    <span>Tutoriales</span>
                    <small>Cómo usar tu medalla</small>
                </div>
            </a>

            <a href="https://wa.me/51992849437?text=Hola%20Pet3D%20SAFE,%20necesito%20ayuda%20con%20mi%20medalla" class="menu-item btn-support">
                <i class="fab fa-whatsapp"></i>
                <div class="menu-text">
                    <span>Soporte Técnico</span>
                    <small>Habla con nosotros</small>
                </div>
            </a>
        </div>

        <p class="footer-text">Tecnología que los trae de vuelta a casa.</p>
    </div>

</body>
</html>
