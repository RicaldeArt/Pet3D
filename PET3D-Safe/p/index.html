
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet3D Safe - Sistema Inteligente</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgAXgh5ETT6xg65k7iZZhRgSwq8TBXBiC",
            authDomain: "pet3d-safe.firebaseapp.com",
            databaseURL: "https://pet3d-safe-default-rtdb.firebaseio.com",
            projectId: "pet3d-safe",
            storageBucket: "pet3d-safe.appspot.com",
            messagingSenderId: "707121344486",
            appId: "1:707121344486:web:01f9fa4ce84462b3233027"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const params = new URLSearchParams(window.location.search);
        const petId = params.get('id');

        if (petId) {
            const petRef = ref(db, 'mascotas/' + petId);
            onValue(petRef, (snapshot) => {
                const data = snapshot.val();
                document.getElementById('loading').style.display = 'none';
                
                if (data && data.nombre) {
                    // MODO PERFIL: La mascota ya existe
                    document.getElementById('profile').style.display = 'block';
                    document.getElementById('registerForm').style.display = 'none';
                    document.getElementById('petName').innerText = data.nombre;
                    document.getElementById('petStatus').innerText = data.estado || "¡Ayúdame a volver a casa!";
                    document.getElementById('btnWa').href = "https://wa.me/" + data.whatsapp;
                } else {
                    // MODO REGISTRO: El ID es nuevo
                    document.getElementById('profile').style.display = 'none';
                    document.getElementById('registerForm').style.display = 'block';
                    document.getElementById('displayId').innerText = petId;
                }
            });
        }

        // Función para guardar el registro
        window.registrarMascota = function() {
            const nombre = document.getElementById('regNombre').value;
            const whatsapp = document.getElementById('regWhatsapp').value;
            if(nombre && whatsapp) {
                set(ref(db, 'mascotas/' + petId), {
                    nombre: nombre,
                    whatsapp: whatsapp,
                    estado: "¡Ayúdame a volver a casa!"
                }).then(() => alert("¡Mascota registrada con éxito!"));
            } else {
                alert("Por favor llena todos los campos");
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #2a2a2a; padding: 25px; border-radius: 20px; text-align: center; width: 90%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; box-sizing: border-box; }
        .btn { display: block; background: #25D366; color: white; text-decoration: none; padding: 15px; border-radius: 10px; font-weight: bold; margin-top: 15px; cursor: pointer; border: none; width: 100%; }
        #profile, #registerForm { display: none; }
        .id-badge { background: #444; padding: 5px 10px; border-radius: 5px; font-size: 0.8em; }
    </style>
</head>
<body>
    <div id="loading" class="card"><h2>Cargando...</h2></div>

    <div id="profile" class="card">
        <h1 id="petName"></h1>
        <p id="petStatus"></p>
        <a id="btnWa" href="#" class="btn">Contactar Dueño</a>
    </div>

    <div id="registerForm" class="card">
        <h2>Nueva Medalla <span class="id-badge" id="displayId"></span></h2>
        <p>Esta medalla no tiene dueño aún. ¡Regístrala!</p>
        <input type="text" id="regNombre" placeholder="Nombre de la mascota">
        <input type="number" id="regWhatsapp" placeholder="WhatsApp (ej: 51999...)">
        <button onclick="registrarMascota()" class="btn" style="background: #007bff;">Activar Medalla</button>
    </div>
</body>
</html>
