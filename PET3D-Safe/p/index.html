<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet3D Safe - Perfil</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // CONFIGURACIÓN REAL DE TU PROYECTO
        const firebaseConfig = {
            apiKey: "AIzaSyCgAXgh5ETT6xg65k7iZZhRgSwq8TBXBiC",
            authDomain: "pet3d-safe.firebaseapp.com",
            databaseURL: "https://pet3d-safe-default-rtdb.firebaseio.com",
            projectId: "pet3d-safe",
            storageBucket: "pet3d-safe.appspot.com",
            messagingSenderId: "707121344486",
            appId: "1:707121344486:web:01f9fa4ce84462b3233027"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const params = new URLSearchParams(window.location.search);
        const petId = params.get('id');

        if (petId) {
            const petRef = ref(db, 'mascotas/' + petId);
            onValue(petRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('profile').style.display = 'block';
                    document.getElementById('petName').innerText = data.nombre;
                    document.getElementById('petStatus').innerText = data.estado;
                    document.getElementById('btnWa').href = "https://wa.me/" + data.whatsapp;
                } else {
                    document.getElementById('loading').innerHTML = "<h2>ID no encontrado</h2>";
                }
            });
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 25px; text-align: center; width: 85%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 10px; }
        p { color: #666; font-size: 1.1em; }
        .btn { display: block; background: #25D366; color: white; text-decoration: none; padding: 15px; border-radius: 12px; font-weight: bold; margin-top: 25px; transition: 0.3s; }
        .btn:hover { background: #128C7E; }
        #profile { display: none; }
    </style>
</head>
<body>
    <div id="loading" class="card"><h2>Buscando Mascota...</h2></div>
    <div id="profile" class="card">
        <h1 id="petName"></h1>
        <p id="petStatus"></p>
        <a id="btnWa" href="#" class="btn">Contactar al Dueño por WhatsApp</a>
    </div>
</body>
</html>
