<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet3D Safe - Registro</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgAXgh5ETT6xg65k7iZZhRgSwq8TBXBiC",
            authDomain: "pet3d-safe.firebaseapp.com",
            databaseURL: "https://pet3d-safe-default-rtdb.firebaseio.com",
            projectId: "pet3d-safe",
            storageBucket: "pet3d-safe.appspot.com",
            messagingSenderId: "707121344486",
            appId: "1:707121344486:web:01f9fa4ce84462b3233027"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const params = new URLSearchParams(window.location.search);
        const petId = params.get('id');

        if (petId) {
            const petRef = ref(db, 'mascotas/' + petId);
            onValue(petRef, (snapshot) => {
                const data = snapshot.val();
                document.getElementById('loading').style.display = 'none';
                if (data && data.nombre) {
                    document.getElementById('profile').style.display = 'block';
                    document.getElementById('registerForm').style.display = 'none';
                    document.getElementById('petName').innerText = data.nombre;
                    document.getElementById('btnWa').href = "https://wa.me/" + data.whatsapp;
                } else {
                    document.getElementById('profile').style.display = 'none';
                    document.getElementById('registerForm').style.display = 'block';
                    document.getElementById('displayId').innerText = petId;
                }
            });
        }

        window.registrarMascota = function() {
            const nombre = document.getElementById('regNombre').value;
            const whatsapp = document.getElementById('regWhatsapp').value;
            if(nombre && whatsapp) {
                set(ref(db, 'mascotas/' + petId), {
                    nombre: nombre,
                    whatsapp: whatsapp,
                    estado: "¡Ayúdame a volver a casa!"
                }).then(() => {
                    alert("¡Mascota registrada con éxito!");
                    location.reload();
                });
            } else {
                alert("Por favor llena todos los campos");
            }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #1a1a1a 0%, #333 100%); color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .logo { font-size: 2em; font-weight: bold; color: #007bff; margin-bottom: 20px; }
        .card { background: #2a2a2a; padding: 30px; border-radius: 25px; text-align: center; width: 100%; max-width: 350px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 1px solid #444; }
        h2 { margin-top: 0; color: #f8f9fa; }
        input { width: 100%; padding: 15px; margin: 12px 0; border-radius: 12px; border: 1px solid #444; background: #1a1a1a; color: white; font-size: 1em; }
        .btn { display: block; background: #007bff; color: white; text-decoration: none; padding: 16px; border-radius: 12px; font-weight: bold; margin-top: 20px; cursor: pointer; border: none; width: 100%; transition: 0.3s; }
        .btn:hover { background: #0056b3; transform: translateY(-2px); }
        .btn-wa { background: #25D366; }
        .id-badge { background: #444; padding: 4px 12px; border-radius: 50px; font-size: 0.7em; vertical-align: middle; color: #bbb; }
    </style>
</head>
<body>
    <div class="logo">PET3D SAFE</div>
    <div id="loading" class="card"><h2>Cargando...</h2></div>

    <div id="profile" class="card" style="display:none;">
        <h1 id="petName"></h1>
        <p>¡Hola! Soy una mascota protegida.</p>
        <a id="btnWa" href="#" class="btn btn-wa">Contactar a mi dueño</a>
    </div>

    <div id="registerForm" class="card" style="display:none;">
        <h2>Activar Medalla <span class="id-badge" id="displayId"></span></h2>
        <p>Registra los datos para proteger a tu mascota.</p>
        <input type="text" id="regNombre" placeholder="Nombre de la mascota">
        <input type="number" id="regWhatsapp" placeholder="WhatsApp (ej: 51999...)">
        <button onclick="registrarMascota()" class="btn">Vincular Medalla</button>
    </div>
</body>
</html>
