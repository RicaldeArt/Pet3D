<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet3D Safe - Identificación</title>
    <style>
        body {
            /* Papel tapiz de huellitas sutil */
            background-color: #f8f9fa;
            background-image: url('https://www.transparenttextures.com/patterns/paws.png');
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 400px;
            padding: 25px;
            text-align: center;
            position: relative;
            border: 2px solid #e0e0e0;
        }

        /* El icono de WiFi (3 tubitos curvos) como marca de agua */
        .card::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="lightgrey" opacity="0.15"><path d="M12 18c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm0-11c3.04 0 5.79 1.23 7.78 3.22l-1.42 1.42c-1.63-1.62-3.87-2.64-6.36-2.64s-4.73 1.02-6.36 2.64l-1.42-1.42c1.99-1.99 4.74-3.22 7.78-3.22zm0-4c5.25 0 10.01 2.13 13.44 5.56l-1.42 1.42C20.88 4.12 16.69 2 12 2S3.12 4.12.98 6.98L-.44 5.56C2.99 2.13 7.75 0 12 0z"/></svg>');
            background-repeat: no-repeat;
            background-position: center;
            z-index: 0;
        }

        .content { position: relative; z-index: 1; }

        .pet-photo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid #ffcc00; /* Color alegre */
            object-fit: cover;
            margin-top: 10px;
        }

        .status-lost {
            background: #ff4757;
            color: white;
            padding: 6px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            display: inline-block;
            margin: 10px 0;
        }

        .info-box {
            text-align: left;
            background: #fdfdfd;
            padding: 15px;
            border-radius: 15px;
            margin: 15px 0;
            border: 1px solid #eee;
        }

        .info-box p { margin: 8px 0; color: #444; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            margin-bottom: 10px;
            transition: transform 0.2s;
        }

        .btn:active { transform: scale(0.98); }
        .btn-wsp { background-color: #25d366; }
        .btn-gps { background-color: #3867d6; }

    </style>
</head>
<body>

<div class="card">
    <div class="content">
        <img src="https://via.placeholder.com/150" alt="Mascota" class="pet-photo">
        
        <div><span class="status-lost">🚨 ESTADO: PERDIDO</span></div>

        <h2 style="margin: 5px 0; color: #2d3436;">Nombre de Mascota</h2>
        
        <div class="info-box">
            <p><strong>📍 Distrito:</strong> <span id="distrito">Cargando...</span></p>
            <p><strong>⚠️ Salud:</strong> <span id="salud">Cargando...</span></p>
        </div>

        <a href="#" id="link-wsp" class="btn btn-wsp">
            💬 WhatsApp del Dueño
        </a>

        <a href="#" onclick="alert('Enviando ubicación...')" class="btn btn-gps">
            📍 Compartir mi Ubicación
        </a>
    </div>
</div>

<script>
    // Aquí es donde leeremos el ?id= de la URL que grabaste en el chip
    const urlParams = new URLSearchParams(window.location.search);
    const petId = urlParams.get('id');

    // Por ahora, simulamos los datos. 
    // Luego esto leerá de tu lista de 1000 perros.
    if(petId) {
        document.getElementById('distrito').innerText = "Distrito Ejemplo " + petId;
        document.getElementById('salud').innerText = "Ninguna condición especial";
    }
</script>

</body>
</html>
