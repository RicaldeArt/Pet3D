<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutoriales - Pet3D Safe</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f4f4f4; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .logo { width: 120px; margin-bottom: 20px; }
        .step { margin-bottom: 30px; text-align: left; padding: 15px; border-bottom: 1px solid #eee; }
        .step img { width: 100%; border-radius: 15px; margin-top: 10px; }
        h2 { color: #ff6600; font-size: 18px; }
        .btn-back { display: inline-block; margin-top: 20px; color: #666; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://ricaldeart.github.io/Pet3D/PET3D-Safe/logo-web.png" class="logo">
        <h1>Guía de Uso</h1>
        
        <div class="step">
            <h2>1. Activa el NFC</h2>
            <p>Asegúrate de tener el NFC encendido en los ajustes de tu celular (Android) o simplemente acerca la parte superior de tu iPhone.</p>
        </div>

        <div class="step">
            <h2>2. Escaneo Correcto</h2>
            <p>Acerca el celular a la medalla como se muestra en la imagen:</p>
            <img src="https://ricaldeart.github.io/Pet3D/PET3D-Safe/p/mano-nfc.png" alt="Tutorial NFC">
        </div>

        <a href="index.html" class="btn-back">← Volver al Menú</a>
    </div>
</body>
</html>
