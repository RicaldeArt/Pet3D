<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PET3D Safe - Mascota Perdida</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .avatar { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 5px solid #ff4b2b; margin-bottom: 15px; }
        h1 { color: #ff4b2b; margin: 10px 0; }
        .info { background: #fff5f5; padding: 15px; border-radius: 10px; margin: 15px 0; text-align: left; border-left: 5px solid #ff4b2b; font-size: 0.9em; }
        .btn-whatsapp { background-color: #25d366; color: white; padding: 15px 10px; text-decoration: none; border-radius: 50px; display: block; font-weight: bold; font-size: 1em; margin-top: 15px; }
        .btn-geo { background-color: #4285F4; color: white; padding: 15px 10px; border: none; border-radius: 50px; display: block; font-weight: bold; font-size: 1em; margin-top: 10px; width: 100%; cursor: pointer; font-family: inherit; }
        .brand { margin-top: 30px; font-size: 0.8em; color: #999; }
    </style>
</head>
<body>
    <div class="card">
        <img src="trico.jpg" alt="Trico" class="avatar">
        <h1>¡Hola! Soy Trico</h1>
        <p><strong>ESTOY PERDIDO</strong>. Mi familia me está buscando, ayúdame a volver a casa.</p>

        <div class="info">
            <p><strong>📍 Hogar:</strong> La Molina, Lima</p>
            <p><strong>⚠️ Nota:</strong> Soy grandote pero muy dócil, no tengas miedo.</p>
        </div>

        <a href="https://wa.me/51992849437?text=¡Hola!%20He%20encontrado%20a%20Trico.%20En%20un%20momento%20te%20envío%20mi%20ubicación." class="btn-whatsapp">
            📞 AVISAR POR WHATSAPP
        </a>

        <button onclick="enviarUbicacion()" class="btn-geo">
            📍 COMPARTIR MI UBICACIÓN
        </button>
    </div>

    <div class="brand">Protegido por Pet 3D Safe 🐾</div>

    <script>
    function enviarUbicacion() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const urlMaps = `https://www.google.com/maps?q=${lat},${lon}`;
                window.location.href = `https://wa.me/51992849437?text=¡Aquí me encuentro con Trico!:%20${urlMaps}`;
            }, function() {
                alert("Por favor, permite el acceso a la ubicación para avisar a mi familia.");
            });
        } else {
            alert("Tu navegador no soporta geolocalización.");
        }
    }
    </script>
</body>
</html>
