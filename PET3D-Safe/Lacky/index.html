<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PET3D Safe - Mascota Perdida</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .avatar { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 5px solid #ff4b2b; margin-bottom: 15px; }
        h1 { color: #ff4b2b; margin: 10px 0; }
        .info { background: #fff5f5; padding: 15px; border-radius: 10px; margin: 15px 0; text-align: left; border-left: 5px solid #ff4b2b; }
        .btn-whatsapp { background-color: #25d366; color: white; padding: 15px 20px; text-decoration: none; border-radius: 50px; display: block; font-weight: bold; font-size: 1.1em; margin-top: 20px; transition: 0.3s; }
        .btn-whatsapp:hover { background-color: #128c7e; }
        .brand { margin-top: 30px; font-size: 0.8em; color: #999; }
    </style>
</head>
<body>
    <div class="card">
        <img src="foto.jpg" alt="Foto de la mascota" class="avatar">
        <h1>¡Hola! Soy Lacky</h1>
        <p><strong>ESTOY PERDIDO</strong> y mi familia me busca con mucha tristeza. Por favor, ayúdame a volver con ellos.</p>
        
        <div class="info">
            <p><strong>📍 Hogar:</strong> Miraflores, Lima</p>
            <p><strong>⚠️ Nota Médica:</strong> Soy alérgica al pollo y necesito mi medicina diaria.</p>
        </div>

        <a href="https://wa.me/519XXXXXXXX?text=Hola!%20He%20encontrado%20a%20Lacky.%20Te%20comparto%20mi%20ubicación." class="btn-whatsapp">
            📞 AVISAR A MI FAMILIA
        </a>
    </div>
    <div class="brand">Protegido por Pet 3D Safe 🐾</div>
</body>
</html>
