<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet3D Safe - Identificación</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #25d366;
            --secondary: #4b7bec;
            --bg: #eef2f7;
            --text: #2d3436;
        }
        body { 
            background-color: var(--bg); 
            background-image: url("https://www.transparenttextures.com/patterns/paws.png"); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; padding: 20px;
        }
        #loading { font-weight: bold; color: #666; }
        .card { 
            background: white; border-radius: 35px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.12); 
            width: 100%; max-width: 380px; padding: 30px; 
            text-align: center; display: none; border: 1px solid rgba(255,255,255,0.3);
        }
        .logo-pet3d { width: 160px; height: auto; margin-bottom: 20px; }
        .photo-container { position: relative; display: inline-block; margin-bottom: 10px; }
        .pet-photo { 
            width: 160px; height: 160px; border-radius: 50%; 
            border: 6px solid #ffcc00; object-fit: cover;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .pet-name { margin: 10px 0 5px 0; color: var(--text); font-size: 32px; font-weight: 800; letter-spacing: -1px; }
        .info-box { 
            text-align: left; background: #f8f9fa; padding: 20px; 
            border-radius: 22px; margin: 20px 0; border: 1px solid #edf2f7;
        }
        .info-box p { margin: 8px 0; color: #4a5568; font-size: 15px; }
        .info-box strong { color: var(--text); }
        
        .actions { display: flex; flex-direction: column; gap: 12px; }
        .btn { 
            display: flex; align-items: center; justify-content: center; 
            padding: 16px; border-radius: 18px; text-decoration: none; 
            color: white; font-weight: bold; cursor: pointer; border: none; 
            width: 100%; font-family: inherit; font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }
        .btn i { margin-right: 10px; font-size: 1.2em; }
        .btn:active { transform: scale(0.97); }
        .btn-wsp { background: var(--primary); box-shadow: 0 4px 14px rgba(37, 211, 102, 0.3); }
        .btn-gps { background: var(--secondary); box-shadow: 0 4px 14px rgba(75, 123, 236, 0.3); }
        
        .edit-link { 
            display: inline-block; margin-top: 25px; font-size: 13px; 
            color: #a0aec0; text-decoration: none; cursor: pointer; 
            padding: 8px 15px; border-radius: 10px; transition: 0.3s;
        }
        .edit-link:hover { color: var(--secondary); background: #f1f5f9; }
    </style>
</head>
<body>
    <div id="loading">
        <img src="https://ricaldeart.github.io/Pet3D/PET3D-Safe/logo-web.png" width="100" style="opacity:0.5">
        <p>Buscando mascota...</p>
    </div>

    <div class="card" id="main-card">
        <img src="https://ricaldeart.github.io/Pet3D/PET3D-Safe/logo-web.png" class="logo-pet3d">
        <div class="photo-container">
            <img id="display-photo" src="" class="pet-photo">
        </div>
        <div id="display-name" class="pet-name"></div>
        
        <div class="info-box">
            <p><i class="fas fa-home" style="color:#ffcc00"></i> <strong>Hogar:</strong> <span id="display-home"></span></p>
            <p><i class="fas fa-info-circle" style="color:#ffcc00"></i> <strong>Nota:</strong> <span id="display-note"></span></p>
        </div>

        <div class="actions">
            <a id="btn-whatsapp" href="#" class="btn btn-wsp">
                <i class="fab fa-whatsapp"></i> AVISAR POR WHATSAPP
            </a>
            <button onclick="enviarUbicacion()" class="btn btn-gps">
                <i class="fas fa-location-dot"></i> ENVIAR MI UBICACIÓN
            </button>
        </div>

        <div id="btn-edit" class="edit-link">
            <i class="fas fa-cog"></i> Gestionar perfil del dueño
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://pet3d-safe-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const petId = urlParams.get('id');

        if (petId) {
            db.ref('mascotas/' + petId).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('main-card').style.display = 'block';
                    document.getElementById('display-name').innerText = data.nombre;
                    document.getElementById('display-photo').src = data.fotoUrl;
                    document.getElementById('display-home').innerText = data.hogar;
                    document.getElementById('display-note').innerText = data.estado;
                    
                    const msg = encodeURIComponent(`¡Hola! Encontré a ${data.nombre}. ¿Cómo puedo ayudarte?`);
                    document.getElementById('btn-whatsapp').href = `https://wa.me/${data.whatsapp}?text=${msg}`;
                    
                    document.getElementById('btn-edit').onclick = function() {
                        const pass = prompt("🔐 Ingresa tu clave de dueño para editar:");
                        if (pass === data.password) { window.location.href = "registro.html?id=" + petId; }
                        else if(pass != null) { alert("Clave incorrecta."); }
                    };
                } else {
                    window.location.href = "registro.html?id=" + petId;
                }
            });
        }

        function enviarUbicacion() {
            if (navigator.geolocation) {
                const btn = document.querySelector('.btn-gps');
                btn.innerText = "Obteniendo...";
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
                    const wspLink = document.getElementById('btn-whatsapp').href;
                    window.location.href = `${wspLink}. Mi ubicación actual es: ${mapUrl}`;
                }, () => {
                    alert("Por favor, activa el GPS para enviar tu ubicación.");
                    btn.innerHTML = '<i class="fas fa-location-dot"></i> ENVIAR MI UBICACIÓN';
                });
            }
        }
    </script>
</body>
</html>
