<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorial Pets - Boris</title>
    <style>
        :root {
            --bg-soft: #fcfaf7;
            --text-color: #5d5d5d;
            --accent: #d4af37; 
        }
        
        body { 
            background-color: var(--bg-soft); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; margin: 0; 
            font-family: 'Times New Roman', Times, serif;
        }

        .card { 
            background: white; padding: 25px; border-radius: 40px 40px 25px 25px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.05); 
            text-align: center; width: 85%; max-width: 400px; 
            border-top: 4px solid var(--accent);
        }

        .header-logo { 
            width: 120px; 
            margin-bottom: 15px;
        }

        video { 
            width: 100%; border-radius: 20px; 
            background: #000; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h2 { color: var(--text-color); margin: 10px 0 5px 0; font-weight: normal; font-style: italic; font-size: 1.4rem; }
        
        .nombre-mascota { 
            color: #7a7a7a; 
            font-size: 28px; 
            font-weight: bold; 
            margin-bottom: 20px; 
            letter-spacing: 2px; 
            display: block;
        }
        
        .divider {
            height: 1px;
            width: 50px;
            background: var(--accent);
            margin: 15px auto;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://ricaldeart.github.io/Pet3D/PET3D-Safe/logo-web.png" class="header-logo">
        
        <div class="divider"></div>
        
        <h2>¡Feliz cumpleaños!</h2>
        <span class="nombre-mascota">🐾 BORIS 🐾</span>
        
        <video controls playsinline preload="auto">
            <source src="Boris_vid.mp4" type="video/mp4">
            Tu navegador no soporta la reproducción de este video.
        </video>
    </div>
</body>
</html>
