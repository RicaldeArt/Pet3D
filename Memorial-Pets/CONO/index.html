<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorial Pets - Cono</title>
    <style>
        :root {
            --bg-soft: #fcfaf7;
            --text-color: #5d5d5d;
            --accent: #d4af37; /* Color oro suave para un toque memorial */
        }
        
        body { 
            background-color: var(--bg-soft); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; margin: 0; 
            font-family: 'Times New Roman', Times, serif; /* Un estilo más elegante y clásico */
        }

        .card { 
            background: white; padding: 25px; border-radius: 40px 40px 15px 15px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.05); 
            text-align: center; width: 85%; max-width: 400px; 
            border-top: 4px solid var(--accent);
        }

        video { 
            width: 100%; border-radius: 20px; 
            background: #000; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h2 { color: var(--text-color); margin-bottom: 5px; font-weight: normal; font-style: italic; }
        p { color: #a0a0a0; font-size: 14px; margin-bottom: 25px; }
        
        .footer-logo { width: 80px; margin-top: 25px; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Por siempre en nuestro corazón</h2>
        <p>🐾 Cono 🐾</p>
        
        <video controls playsinline preload="auto">
            <source src="cono.mp4" type="video/mp4">
